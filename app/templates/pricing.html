{% extends "base.html" %}

{% block title %}Pricing - Bank Details Extractor{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="/static/css/payment.css">
{% endblock %}

{% block content %}
<div class="page-container">
    <div class="page-header">
        <h1>Choose Your Plan</h1>
        <p>Select the plan that best fits your needs</p>
    </div>

    <div id="pricing-container" class="pricing-container">

        <div class="loading-message">Loading pricing information...</div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="/static/js/payment.js"></script>
{% endblock %}
